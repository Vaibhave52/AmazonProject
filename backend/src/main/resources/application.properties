server.port=5454

# Load secrets from a local .env file (optional, never committed). See .env.example
spring.config.import=optional:file:.env[.properties]

# Database (MySQL). The database is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT secret (at least 32 characters). Set JWT_SECRET in .env for anything beyond local testing.
jwt.secret=${JWT_SECRET:}

# Razorpay test keys (only needed for the payment step at checkout)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
